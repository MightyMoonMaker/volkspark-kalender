name: Kalender aktualisieren
on:
  schedule:
    - cron: "0 5 * * *"   # taeglich ca. 06:00/07:00 Uhr deutscher Zeit
  workflow_dispatch:       # manuell startbar
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_calendar.py
      - run: |
          git config user.name "kalender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/volkspark.ics
          git diff --cached --quiet || git commit -m "Kalender aktualisiert"
          git push
